          echo "Created ${PKG}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: vtk-linux-aarch64
          path: vtk-${{ env.VTK_VERSION }}-linux-aarch64.tar.gz
          retention-days: 7

  # ── Linux x86_64 musl (Alpine Linux) ──────────────────────────────────────
  # NOTE: We intentionally do NOT use `container: image: alpine:3.22` here.
  # GitHub Actions runs a glibc-linked Node.js binary for JS-based actions
  # (checkout, cache, upload-artifact); that binary crashes immediately inside
  # a musl container with "Exec format error" / SIGILL.  Instead, the job runs
  # on ubuntu-latest and only the build steps are executed inside Alpine via
  # an explicit `docker run`, which gives us a true musl build environment
  # while keeping all GitHub Actions plumbing on the glibc host.
  build-linux-musl-x86_64:
    name: Linux x86_64 musl (Alpine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore build cache
        id: cache
        uses: actions/cache@v5
        with:
          path: install
          key: vtk-${{ env.VTK_VERSION }}-linux-musl-x86_64${{ inputs.force_rebuild == 'true' && format('-bust-{0}', github.run_id) || '' }}

      - name: Download VTK source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.VTK_VERSION }}"
          MINOR="${VER%.*}"
          curl -fsSL "https://www.vtk.org/files/release/${MINOR}/VTK-${VER}.tar.gz" -o vtk-src.tar.gz
          tar -xzf vtk-src.tar.gz

      - name: Build and install VTK inside Alpine container
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.VTK_VERSION }}"
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine:3.22 \
            sh -c "
              set -eux
              apk add --no-cache cmake ninja g++ make curl linux-headers
              mkdir -p build install
              cd build
              cmake -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/work/install \
                -DBUILD_SHARED_LIBS=OFF \
                -DVTK_BUILD_ALL_MODULES=OFF \
                -DVTK_MODULE_ENABLE_VTK_IOLegacy=YES \
                -DVTK_MODULE_ENABLE_VTK_IOXML=YES \
                -DVTK_MODULE_ENABLE_VTK_IOCore=YES \
                -DVTK_MODULE_ENABLE_VTK_CommonCore=YES \
                -DVTK_MODULE_ENABLE_VTK_CommonDataModel=YES \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DCMAKE_C_FLAGS='-fPIC' \
                -DCMAKE_CXX_FLAGS='-fPIC' \
                /work/VTK-${VER}
              ninja -j\$(nproc)
              ninja install
            "

      - name: Package archive
        run: |
          VER="${{ env.VTK_VERSION }}"
          MINOR="${VER%.*}"
          PKG="vtk-${VER}-linux-musl-x86_64"
          mkdir -p "${PKG}/include/vtk-${MINOR}" "${PKG}/lib"
          SRC_INC=$(find install/include -maxdepth 1 -name "vtk-*" -type d | sort -V | tail -1)
          if [ -n "${SRC_INC}" ]; then
            cp -R "${SRC_INC}/"* "${PKG}/include/vtk-${MINOR}/"
          fi
          find install/lib -name "*.a" -exec cp {} "${PKG}/lib/" \;
          tar -czf "${PKG}.tar.gz" "${PKG}"
          echo "Created ${PKG}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: vtk-linux-musl-x86_64
          path: vtk-${{ env.VTK_VERSION }}-linux-musl-x86_64.tar.gz
          retention-days: 7

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-windows-shared, build-macos-arm64, build-macos-x86_64, build-linux, build-linux-aarch64, build-linux-musl-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Delete stale ucrt-x64 asset if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset v${{ env.VTK_VERSION }} \
            "vtk-${{ env.VTK_VERSION }}-ucrt-x64.zip" \
            --repo ${{ github.repository }} --yes 2>/dev/null || true

      - name: Write release notes
        run: |
          VER="${{ env.VTK_VERSION }}"
          MINOR="${VER%.*}"
          cat > release-notes.md << 'NOTES'
          Pre-built VTK **$VER** static (`.a`) libraries for use with the [`rvtk`](https://github.com/astamm/rvtk) R package.

          ## Archives

          | Platform | Link type | Archive |
          |---|---|---|
          | Windows (Rtools45 static.posix x64) | static `.a` | `vtk-$VER-static-posix-x64.zip` |
          | Windows (Rtools45 static.posix x64) | shared `.dll` | `vtk-$VER-shared-posix-x64.zip` |
          | macOS arm64 (Apple Silicon) | static `.a` | `vtk-$VER-darwin-arm64.tar.gz` |
          | macOS x86\_64 (Intel) | static `.a` | `vtk-$VER-darwin-x86_64.tar.gz` |
          | Linux x86\_64 (glibc) | static `.a` | `vtk-$VER-linux-x86_64.tar.gz` |
          | Linux x86\_64 (musl / Alpine) | static `.a` | `vtk-$VER-linux-musl-x86_64.tar.gz` |
          | Linux aarch64 | static `.a` | `vtk-$VER-linux-aarch64.tar.gz` |

          ## Archive layout

          **Static** (`*-static-posix-x64.zip`):
          ```
          include/vtk-$MINOR/    ← VTK headers
          lib/                   ← static libraries (.a)
          ```

          **Shared** (`*-shared-posix-x64.zip`):
          ```
          include/vtk-$MINOR/    ← VTK headers
          lib/                   ← import libraries (.dll.a, for link time)
          bin/                   ← DLLs (.dll, for run time)
          ```

          > The shared-DLL build uses the same `x86_64-w64-mingw32.static.posix`
          > toolchain with `-static-libgcc -static-libstdc++`, so VTK DLLs carry no
          > dependency on external MSYS2 runtime DLLs.

          ## CMake flags (all platforms)

          ```cmake
          # Static build:  -DBUILD_SHARED_LIBS=OFF
          # Shared build:  -DBUILD_SHARED_LIBS=ON
          #                -DCMAKE_SHARED_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          -DVTK_BUILD_ALL_MODULES=OFF
          -DVTK_MODULE_ENABLE_VTK_IOLegacy=YES
          -DVTK_MODULE_ENABLE_VTK_IOXML=YES
          -DVTK_MODULE_ENABLE_VTK_IOCore=YES
          -DVTK_MODULE_ENABLE_VTK_CommonCore=YES
          -DVTK_MODULE_ENABLE_VTK_CommonDataModel=YES
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          ```

          ### Windows additional flags

          ```cmake
          # Compiler: x86_64-w64-mingw32.static.posix (Rtools45 R-package toolchain)
          # Set via CC/CXX/AR/RANLIB environment variables before cmake invocation.
          # Modules disabled because static libs are not available in the sysroot:
          -DVTK_MODULE_ENABLE_VTK_IONetCDF=NO
          -DVTK_MODULE_ENABLE_VTK_IOHDF=NO
          -DVTK_MODULE_ENABLE_VTK_GeovisCore=NO
          -DVTK_MODULE_ENABLE_VTK_RenderingCore=NO
          -DVTK_MODULE_ENABLE_VTK_netcdf=NO
          -DVTK_MODULE_ENABLE_VTK_libproj=NO
          -DVTK_MODULE_USE_EXTERNAL_VTK_netcdf=OFF
          -DVTK_MODULE_USE_EXTERNAL_VTK_libproj=NO
          -DH5_HAVE_VASPRINTF:INTERNAL=0
          ```
          NOTES
          # Expand $VER / $MINOR placeholders (heredoc kept literal to avoid yaml issues)
          sed -i "s|\$VER|${VER}|g; s|\$MINOR|${MINOR}|g" release-notes.md

      - name: Create or update release (title + notes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ env.VTK_VERSION }}"
          TITLE="VTK ${VER} — pre-built static libraries"
          if gh release view "v${VER}" --repo ${{ github.repository }} &>/dev/null; then
            gh release edit "v${VER}" \
              --repo ${{ github.repository }} \
              --title "${TITLE}" \
              --notes-file release-notes.md
          else
            gh release create "v${VER}" \
              --repo ${{ github.repository }} \
              --title "${TITLE}" \
              --notes-file release-notes.md
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VTK_VERSION }}
          files: |
            artifacts/vtk-windows-static-posix-x64/vtk-${{ env.VTK_VERSION }}-static-posix-x64.zip
            artifacts/vtk-windows-shared-posix-x64/vtk-${{ env.VTK_VERSION }}-shared-posix-x64.zip
            artifacts/vtk-macos-arm64/vtk-${{ env.VTK_VERSION }}-darwin-arm64.tar.gz
            artifacts/vtk-macos-x86_64/vtk-${{ env.VTK_VERSION }}-darwin-x86_64.tar.gz
            artifacts/vtk-linux-x86_64/vtk-${{ env.VTK_VERSION }}-linux-x86_64.tar.gz
            artifacts/vtk-linux-musl-x86_64/vtk-${{ env.VTK_VERSION }}-linux-musl-x86_64.tar.gz
            artifacts/vtk-linux-aarch64/vtk-${{ env.VTK_VERSION }}-linux-aarch64.tar.gz
